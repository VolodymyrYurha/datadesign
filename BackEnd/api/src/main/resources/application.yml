# Defaults match DataBase-infrastructure/docker-compose.yml.
# Override with env vars (MONGO_URI, NEO4J_URI, ...) or an application-<profile>.yml.

server:
  port: ${PORT:8080}

spring:
  application:
    name: study-system-api
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/usi?serverSelectionTimeoutMS=2000}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    connection-timeout: 2s
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:usi-study-pass}
  elasticsearch:
    uris: ${ELASTIC_URI:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 5s

app:
  cors:
    allowed-origins:
      - http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs

scalar:
  path: /scalar
  dark-mode: true

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
